aid: napkin
name: Napkin
description: >-
  Napkin AI turns typed or pasted text into editable visuals — diagrams, charts, icons, and
  infographics — and into full presentation decks, with no prompting or design skill required.
  Two products share one text-to-visual engine: Napkin Visuals (standalone diagrams and graphics)
  and Napkin Slides (beta AI presentation agent). Napkin also ships a developer API (currently a
  developer preview) for generating visuals programmatically: submit text, poll the asynchronous
  request, and download the results as SVG, PNG, or PPT. The API authenticates with account bearer
  tokens or an OAuth 2.0 authorization-code flow. Napkin is an AI company backed by CRV.
